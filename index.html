<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#D3EDE7">
<title>Jadwal Pengiriman | PT Murinda Sentra Baja</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
:root{--ink:#0F2438;--ink2:#34465A;--muted:#6B7A8C;--line:rgba(15,36,56,.1);--red:#D90429;--sent:#0E9F6E;--pending:#D97706;--stock:#64748B;--sh:0 1px 2px rgba(15,36,56,.05),0 14px 34px -14px rgba(15,36,56,.18)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;font-variant-numeric:tabular-nums;background:radial-gradient(900px 520px at 6% -8%,#dce8fb,transparent 62%),radial-gradient(800px 480px at 100% 0,#fbe3e8,transparent 58%),#F4F6FA;background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
.card{background:rgba(255,255,255,.74);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.95);box-shadow:var(--sh);border-radius:18px}

/* Topbar */
.topbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px clamp(16px,3vw,40px);background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:38px}
.brand strong{display:block;font-size:.98rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:.76rem;color:var(--muted);font-weight:600}
.meta{display:flex;align-items:center;gap:14px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.live{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(14,159,110,.1);color:#087A55}
.live .sep{color:var(--muted)}
.live.off{background:rgba(217,4,41,.08);color:var(--red)}.live.off .pulse{background:var(--red);animation:none}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--sent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,159,110,.5)}70%{box-shadow:0 0 0 7px rgba(14,159,110,0)}100%{box-shadow:0 0 0 0 rgba(14,159,110,0)}}

/* Layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;max-width:1700px;margin:0 auto;padding:22px clamp(16px,3vw,40px) 40px;align-items:start}
.side{padding:20px;position:sticky;top:84px}
.side h2{font-size:.95rem;font-weight:800;margin-bottom:14px}
#summaryContainer{display:flex;flex-direction:column;gap:8px;max-height:min(68vh,calc(100vh - 430px));min-height:120px;overflow:auto}
.cl{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.65);overflow:hidden}
.cl>button{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 13px;background:none;border:0;text-align:left;font-weight:700;font-size:.85rem}
.cl>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl>button b{background:var(--ink);color:#fff;border-radius:99px;padding:2px 9px;font-size:.75rem}
.cl .dt{display:none;flex-direction:column;gap:6px;padding:4px 13px 11px}.cl.open .dt{display:flex}
.dt div{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2);font-weight:600}
.dt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.noc{color:var(--muted);font-size:.85rem;font-weight:600;padding:6px 2px}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{padding:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#monthSub{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:4px}
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:10px;font-weight:700;font-size:.85rem;transition:background .15s}
.btn:hover{background:#fff}
.btn.arrow{width:38px;padding:0;justify-content:center;font-size:1.2rem}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:#1B3B58}
.jump input{border:0;background:none;outline:0;font-weight:700;font-size:.82rem}
.srch{min-width:220px;font-weight:600}
.seg{display:flex;background:rgba(15,36,56,.06);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:700;font-size:.82rem;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,36,56,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.75);font-size:.8rem;font-weight:700}
.chip i{width:8px;height:8px;border-radius:50%}.chip b{font-weight:800}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Brand, rentang, catatan, QR */
:root{--km:#EAB308;--sm:#EA580C}
.brands{display:flex;flex-wrap:wrap;gap:8px}
.brand-tab{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.8);font-weight:800;font-size:.9rem}
.brand-tab i{width:10px;height:10px;border-radius:3px}
.brand-tab b{padding:1px 9px;border-radius:99px;background:rgba(15,36,56,.08);font-size:.76rem}
.brand-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.brand-tab.on b{background:rgba(255,255,255,.2)}
.bd{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:6px;font-size:.68rem;font-weight:800;vertical-align:middle}
.bd.km{background:rgba(234,179,8,.22);color:#854D0E}.bd.sm{background:rgba(234,88,12,.13);color:#9A3412}.bd.xx{background:rgba(100,116,139,.14);color:#475569}
.rng{align-items:center}.rng>span{font-size:.82rem;font-weight:700;color:var(--muted)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.note{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:14px;background:rgba(100,116,139,.1);border:1px solid rgba(100,116,139,.28);font-size:.82rem;line-height:1.55;font-weight:600;color:var(--ink2)}
.note>svg{flex-shrink:0;margin-top:2px;color:#475569}.note b{color:var(--ink)}
.cell.sys{background:repeating-linear-gradient(135deg,rgba(100,116,139,.1) 0 8px,#fff 8px 16px)}
.sysTag{width:fit-content;padding:2px 8px;border-radius:6px;background:#475569;color:#fff;font-size:.62rem;font-weight:800}
.qr{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.qrimg{flex-shrink:0;width:112px;height:112px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:10px}.qrimg svg{display:block;width:100%;height:100%}
.qrtx b{display:block;font-size:.9rem;font-weight:800}.qrtx small{display:block;margin-top:3px;font-size:.76rem;line-height:1.4;font-weight:600;color:var(--muted)}

.brand-tab.km{--c:#EAB308;--t:rgba(234,179,8,.22)}.brand-tab.sm{--c:#EA580C;--t:rgba(234,88,12,.14)}.brand-tab.xx{--c:#64748B;--t:rgba(100,116,139,.12)}
.brand-tab.km,.brand-tab.sm,.brand-tab.xx{background:#fff;border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.brand-tab.on.km,.brand-tab.on.sm,.brand-tab.on.xx{background:#fff;color:var(--ink);box-shadow:0 0 0 4px var(--t),inset 0 -4px 0 var(--c)}
.brand-tab.on.km b,.brand-tab.on.sm b,.brand-tab.on.xx b{background:var(--t);color:var(--ink)}
.bl{display:block;height:18px;width:auto}
.bar{border-top:4px solid var(--bt,rgba(15,36,56,.08))}
.cell{position:relative}
.bst{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0}
.bsp{display:flex;gap:4px}.bsp .bd{margin:0;padding:1px 6px}

/* Stage */
.stage{position:relative;overflow:hidden}
.loader{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);font-weight:700;font-size:.9rem}
.spinner{width:36px;height:36px;border:3px solid rgba(15,36,56,.12);border-top-color:var(--ink);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scroll{overflow:auto;max-height:76vh}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:8px;min-width:808px}
.dow{position:sticky;top:0;z-index:5;padding:14px 16px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}
.dow div{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted)}.dow .sun{color:var(--red)}
.grid{padding:4px 16px 18px}
.cell{min-height:116px;padding:10px;display:flex;flex-direction:column;gap:5px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.cell.blank{visibility:hidden}
.cell.off{background:rgba(217,4,41,.04)}
.dn{align-self:flex-start;font-size:.9rem;font-weight:800;color:var(--ink2)}
.cell.off .dn{color:var(--red)}
.cell.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cell.today .dn{background:var(--ink);color:#fff;border-radius:8px;padding:1px 9px}
.cell.has{cursor:pointer;background:#fff}
.cell.has:hover,.cell.has:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(15,36,56,.3);border-color:rgba(15,36,56,.25)}
.hol{font-size:.64rem;color:var(--red);font-weight:700;line-height:1.2}
.big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.big small{font-size:.7rem;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0}
.dots{display:flex;gap:4px;align-items:center}.dots i{width:7px;height:7px;border-radius:50%}.dots small{font-size:.62rem;font-weight:700;color:var(--muted)}
.sb{margin-top:auto;display:flex;gap:2px;height:5px;border-radius:9px;overflow:hidden;background:rgba(15,36,56,.06)}
.sb i{display:block}.sb .sent{background:var(--sent)}.sb .pending{background:var(--pending)}.sb .stock{background:#94A3B8}
.pill{display:inline-flex;align-items:center;gap:5px;width:fit-content;padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.sent{background:rgba(14,159,110,.12);color:#087A55}.pill.pending{background:rgba(217,119,6,.13);color:#A15A04}.pill.stock{background:rgba(100,116,139,.13);color:#475569}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-weight:600;font-size:.88rem}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* Daftar bulan */
.lg{border-bottom:1px solid var(--line)}.lg:last-child{border:0}
.lh{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(244,246,250,.94);backdrop-filter:blur(10px);cursor:pointer}
.ld{width:46px;text-align:center;line-height:1.15}.ld b{display:block;font-size:1.35rem;font-weight:800}.ld span{font-size:.7rem;font-weight:700;color:var(--muted)}
.lt{flex:1;font-weight:700;font-size:.92rem}.lt small{display:block;color:var(--muted);font-weight:600;font-size:.76rem;margin-top:2px}
.lh .sb{width:96px;margin:0}
.lr{display:grid;grid-template-columns:5px minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1fr) 96px;gap:14px;align-items:center;width:100%;text-align:left;padding:11px 18px;background:none;border:0;border-top:1px solid var(--line);font-size:.84rem;font-weight:600}
.lr:hover{background:rgba(255,255,255,.85)}
.tag{align-self:stretch;border-radius:4px}
.lr b,.dr b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.lr em,.dr em{font-style:normal;color:var(--muted);font-size:.76rem;font-weight:600}
.lr .ty{font-weight:800}

/* Modal */
.overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,36,56,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}#itemModal{z-index:1100}
.sheet{width:100%;max-width:780px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border-radius:24px;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);box-shadow:0 30px 80px -20px rgba(15,36,56,.5);transform:translateY(16px) scale(.98);transition:transform .25s}
.overlay.show .sheet{transform:none}
.sheet.narrow{max-width:540px}
.sh{display:flex;align-items:center;gap:12px;padding:20px 22px 16px}
.grow{flex:1;min-width:0}
.sh h3{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.sh p{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:3px}
.dbox{flex-shrink:0;width:60px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:16px;background:linear-gradient(160deg,var(--ink),#23476B);color:#fff;line-height:1}
.dbox b{font-size:1.65rem;font-weight:800}.dbox span{font-size:.7rem;font-weight:700;opacity:.8}
.ib{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.05rem}
.ib:disabled{opacity:.35;cursor:default}.ib.x:hover{background:var(--red);color:#fff;border-color:var(--red)}
.st{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px 14px;border-bottom:1px solid var(--line)}
.sbody{overflow:auto;padding:6px 22px 22px}
.cg{margin-top:16px}
.cg h4{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.8rem;font-weight:800;color:var(--ink2)}
.dr{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;margin-bottom:6px;padding:11px 14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.dr:hover{border-color:rgba(15,36,56,.3);box-shadow:0 6px 16px -8px rgba(15,36,56,.3)}
.dr b{font-size:.9rem}
.bc{display:flex;flex-direction:column;align-items:center;padding:16px;border:1px dashed rgba(15,36,56,.2);border-radius:14px;background:#fff}
.bc b{font-size:1rem;margin-bottom:6px;overflow-wrap:anywhere}.bc svg{width:100%;max-width:340px;height:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv div{padding:11px 13px;border-radius:12px;background:rgba(15,36,56,.04)}
.kv span{display:block;margin-bottom:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.kv b{font-size:.9rem;font-weight:800;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:28px;z-index:2000;transform:translate(-50%,20px);padding:11px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:.84rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsif */
@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{position:static}#summaryContainer{max-height:50vh}}
@media(max-width:700px){
 .topbar{padding:10px 14px}#realTimeClock,.live .sep{display:none}
 h1{font-size:1.4rem}.bar{padding:14px}.srch{min-width:0;width:100%}.chips{flex-basis:100%}
 .cell{min-height:100px;padding:8px}.scroll{max-height:70vh}
 .lr{grid-template-columns:5px minmax(0,1fr) auto;grid-template-areas:"t m p" "t c p" "t y p";gap:2px 12px;padding:12px 14px}
 .lr .tag{grid-area:t}.lr .mn{grid-area:m}.lr .cli{grid-area:c;color:var(--ink2)}.lr .ty{grid-area:y;font-size:.76rem}.lr .pill{grid-area:p}
 .lh .sb{display:none}.sh{padding:16px 16px 12px;gap:8px}.sbody{padding:4px 16px 18px}.st{padding:0 16px 12px}.kv{grid-template-columns:1fr}
}

/* Laporan PDF */
#report{display:none}
.rp{font-family:'Inter',sans-serif;color:#0F2438;font-size:9pt}
.rp-head{position:relative;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid #0F2438}
.rp-head::after{content:"";position:absolute;left:0;bottom:-1.5px;width:70px;height:3.5px;background:#D90429}
.rp-brand{display:flex;gap:12px;align-items:center}.rp-brand img{height:44px}
.rp-brand b{display:block;font-size:13pt;font-weight:800}
.rp-brand span{display:block;max-width:92mm;font-size:7.3pt;line-height:1.5;color:#64748B}
.rp-doc{text-align:right}.rp-doc h1{font-size:17pt;font-weight:800;letter-spacing:-.02em}
.rp-doc p{margin-top:2px;font-size:8.5pt;color:#475569}
.rp-right{display:flex;align-items:flex-end;gap:16px}
.rp-qr{display:flex;align-items:center;gap:8px;font-size:6.8pt;line-height:1.35;font-weight:600;color:#64748B}.rp-qr b{display:block;font-size:7.5pt;color:#0F2438}.rp-qr svg{width:20mm;height:20mm}
.rp-k{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.rp-k div{padding:9px 12px;border-radius:8px;border-left:3px solid #0F2438;background:#F1F5F9}
.rp-k b{display:block;font-size:19pt;font-weight:800;line-height:1.1}.rp-k span{font-size:7.5pt;font-weight:600;color:#64748B}
.rp-k .s{border-color:#0E9F6E}.rp-k .p{border-color:#D97706}.rp-k .k{border-color:#94A3B8}
.rp-bar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:#E2E8F0;margin-bottom:6px}
.rp-cap{margin-bottom:6px;font-size:8pt;color:#475569}
.rp h2{margin:14px 0 6px;font-size:10pt;font-weight:800}
.rp table{width:100%;border-collapse:collapse}.rp table.sm{width:62%}
.rp th{padding:6px 8px;background:#0F2438;color:#fff;font-size:7.5pt;font-weight:700;text-align:left}
.rp td{padding:5px 8px;border-bottom:1px solid #E8EDF3;font-size:8.3pt}
.rp tbody tr:nth-child(even) td{background:#FAFBFD}
.rp .n{width:36px;text-align:center}
.rp thead{display:table-header-group}.rp tr{break-inside:avoid}
.rp tr.g td{padding:6px 8px;border:0;background:#E6EDF6;font-weight:800}
.rp tr.g span{float:right;font-weight:600;color:#475569}
.rp .dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%}
.rs{display:inline-block;padding:1.5px 8px;border-radius:9px;font-size:7.3pt;font-weight:800}
.rs.sent{background:#DCF5EA;color:#087A55}.rs.pending{background:#FDF0D5;color:#9A5B05}.rs.stock{background:#EDF0F4;color:#475569}
.rp-sign{margin-top:16px;padding-top:8px;border-top:1px solid #E2E8F0;font-size:7.5pt;color:#64748B}
@page{size:A4 landscape;margin:12mm 12mm 16mm;
 @bottom-left{content:"PT Murinda Sentra Baja, Master Schedule Pengiriman";font:7.5pt 'Inter',sans-serif;color:#64748B}
 @bottom-right{content:"Halaman " counter(page) " dari " counter(pages);font:7.5pt 'Inter',sans-serif;color:#64748B}}
@media print{html,body{background:#fff!important}#app,.overlay,#toast{display:none!important}#report{display:block}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Tema Wonderful Indonesia + Liquid Glass ===== */

function brandOf(client,type,raw){
  let b=BRAND_RULES.find(r=>r.re.test(client))||BRAND_RULES.find(r=>r.typeRe.test(type));
  if(!b){const row=Object.values(raw).join(' '),m=BRAND_RULES.filter(r=>r.re.test(row));if(m.length===1)b=m[0]}
  return b?b.id:'xx';
}
const brandName=id=>id==='xx'?'Lainnya':((BRAND_RULES.find(r=>r.id===id)||{}).name||'');
const brandOK=i=>fBrand==='all'||i.brand===fBrand;
const brandBadge=i=>i.brand==='xx'?'':`<span class="bd ${i.brand}">${brandName(i.brand)}</span>`;
const brandColor=id=>(BRAND_RULES.find(r=>r.id===id)||{color:'#94A3B8'}).color;
function brandPills(l){
  const c={};l.forEach(i=>c[i.brand]=(c[i.brand]||0)+1);
  const ids=BRAND_RULES.map(r=>r.id).concat('xx').filter(k=>c[k]);
  return fBrand==='all'?`<div class="bsp">${ids.map(k=>`<span class="bk ${k}" title="${brandName(k)}: ${c[k]} unit"><i></i><b>${c[k]}</b></span>`).join('')}</div>`:'';
}

/* ===== Periode (satu bulan / rentang bulan) ===== */
const mIdx=d=>d.getFullYear()*12+d.getMonth();
const mLabel=x=>`${MONTHS[x%12]} ${Math.floor(x/12)}`;
const inPeriod=i=>{const x=mIdx(i.d);return rangeOn?(x>=rFrom&&x<=rTo):x===mIdx(cur)};
const periodLabel=()=>rangeOn?(rFrom===rTo?mLabel(rFrom):`${mLabel(rFrom)} s/d ${mLabel(rTo)}`):mLabel(mIdx(cur));
const effView=()=>rangeOn?'list':view;

function calcSys(){if(!data.length){SYS=null;return}let mx=data[0].d;data.forEach(i=>{if(i.d>mx)mx=i.d});SYS=ymd(mx.getFullYear(),mx.getMonth(),mx.getDate())}
const isSys=i=>!!SYS&&i.key===SYS;
const sysLabel=()=>{const [y,m,d]=SYS.split('-').map(Number);return`${d} ${MONTHS[m-1]} ${y}`};
function renderNote(){

function renderBrands(){

function syncRange(){
  $('navSingle').hidden=rangeOn;$('navRange').hidden=!rangeOn;
  const cb=document.querySelector('#viewSeg [data-v=cal]');cb.disabled=rangeOn;cb.title=rangeOn?'Kalender hanya untuk satu bulan':'';

function fillYears(){
  const cy=new Date().getFullYear(),ys=data.map(i=>i.d.getFullYear()),a=Math.min(cy-2,...ys),b=Math.max(cy+3,...ys);
  ['yearSelect','fromY','toY'].forEach(id=>{const s=$(id),v=s.value;s.innerHTML='';for(let y=a;y<=b;y++)s.add(new Option(y,y));if(v)s.value=v});
}

const ymd=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function sty(n){const k=String(n).toUpperCase().trim();if(PAL[k])return{border:PAL[k][0],text:PAL[k][1]};let h=0;for(const c of k)h=c.charCodeAt(0)+((h<<5)-h);h=Math.abs(h)%360;return{border:`hsl(${h},70%,45%)`,text:`hsl(${h},80%,25%)`}}
function getItemStatus(item){
  const poKey=Object.keys(item).find(k=>k.toLowerCase().includes('po'));
  const stKey=Object.keys(item).find(k=>k.toLowerCase()==='status delivery'||k.toLowerCase().includes('status'));
  const po=poKey&&item[poKey]?String(item[poKey]).trim():'';
  const sv=stKey&&item[stKey]?String(item[stKey]).trim():'';
  if(sv&&!['-','0','undefined','null'].includes(sv))return'sent';
  if(!po||['-','0','undefined','null'].includes(po))return'stock';
  return'pending';
}
function norm(r){
  const keys=Object.keys(r),L=k=>k.toLowerCase().trim();
  const f=fn=>{const k=keys.find(fn);return k&&r[k]?String(r[k]).trim():''};
  const dv=keys.find(k=>L(k).includes('delivery date')||L(k).includes('tanggal'));
  const d=dv&&r[dv]?new Date(r[dv]):null;
  if(!d||isNaN(d))return null;
  const sn=f(k=>L(k)==='serial number');
  const o={raw:r,d,key:ymd(d.getFullYear(),d.getMonth(),d.getDate()),sn,serial:sn||'No Serial',
    unit:f(k=>L(k)==='unit number'),type:f(k=>L(k)==='code serial')||'LAINNYA',
    client:f(k=>/client|customer|nama/.test(L(k)))||'Lainnya',
    dn:f(k=>L(k)==='delivery number'),plate:f(k=>L(k)==='license plate'),driver:f(k=>L(k)==='driver'),
    status:getItemStatus(r)};
  o.brand=brandOf(o.client,o.type,r);return o;
}
const count=l=>{const c={sent:0,pending:0,stock:0};l.forEach(i=>c[i.status]++);return c};
const pill=s=>`<span class="pill ${s}">${ST[s]}</span>`;
function bar(l){const c=count(l);return`<div class="sb" title="Terkirim ${c.sent}, Pending ${c.pending}, Stock ${c.stock}">${['sent','pending','stock'].map(s=>c[s]?`<i class="${s}" style="flex:${c[s]}"></i>`:'').join('')}</div>`}
const chipsHtml=(c,total,act)=>[['all','Semua',total],['sent','Terkirim',c.sent],['pending','Pending',c.pending],['stock','Stock',c.stock]].map(([k,l,n])=>`<button class="chip${act===k?' on':''}" data-s="${k}">${k==='all'?'':`<i style="background:${SC[k]}"></i>`}${l}<b>${n}</b></button>`).join('');
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}

async function fetchData(silent){
  if(!silent)$('loader').style.display='flex';
  try{
    const r=await fetch(APPS_SCRIPT_URL),j=await r.json();
    data=(Array.isArray(j)?j:[]).map(norm).filter(Boolean);data.forEach((x,i)=>x.id=i);calcSys();fillYears();
    setLive(true);
  }catch(e){console.error('Gagal sinkronisasi data:',e);setLive(false)}
  finally{$('loader').style.display='none';renderAll()}
}
function setLive(ok){$('live').classList.toggle('off',!ok);$('liveState').textContent=ok?'Terhubung':'Offline, mencoba lagi'}
const monthItems=()=>data.filter(i=>inPeriod(i)&&brandOK(i));
function filtered(){const s=q.trim().toLowerCase();return monthItems().filter(i=>(fStatus==='all'||i.status===fStatus)&&(!s||[i.serial,i.unit,i.client,i.type,i.dn,i.plate,i.driver].join(' ').toLowerCase().includes(s)))}

function renderAll(){
  const mi=monthItems(),items=filtered(),m=cur.getMonth(),y=cur.getFullYear();
  $('monthSelect').value=m;$('yearSelect').value=y;
  $('monthTitle').textContent=periodLabel();

  $('monthSub').textContent=mi.length?`${bp}${mi.length} unit dijadwalkan ${wh}`:`${bp}Belum ada jadwal pengiriman ${wh}`;
  $('statusChips').innerHTML=chipsHtml(count(mi),mi.length,fStatus);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===effView()));
  $('calView').hidden=effView()!=='cal';$('listView').hidden=effView()!=='list';
  effView()==='cal'?renderCalendar(items):renderList(items);
  renderClients(items);renderBrands();renderNote();syncRange();
  if(dayKey)renderDay();
}
function renderCalendar(items){
  const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),t=new Date();
  $('calendarHeader').innerHTML=DAYS.map((d,i)=>`<div class="${i?'':'sun'}">${d}</div>`).join('');
  const by={};items.forEach(i=>(by[i.d.getDate()]=by[i.d.getDate()]||[]).push(i));
  const mxc=Math.max(1,...Object.values(by).map(a=>a.length));
  let h='<div class="cell blank"></div>'.repeat(first);
  for(let d=1;d<=n;d++){
    const k=ymd(y,m,d),w=new Date(y,m,d).getDay(),hol=HOL[k],l=by[d]||[],cls=['cell'];
    if(w===0||hol)cls.push('off');
    if(d===t.getDate()&&m===t.getMonth()&&y===t.getFullYear())cls.push('today');
    let inner=`<span class="dn">${d}</span>${hol?`<span class="hol">${hol}</span>`:''}`;
    if(l.length){
      cls.push('has');if(k===SYS){cls.push('sys');inner+='<span class="sysTag">Stok sistem</span>'}const tp=[...new Set(l.map(i=>i.type))];
      inner+=`<div class="big">${l.length}<small>unit</small></div><div class="dots">${tp.slice(0,5).map(x=>`<i style="background:${sty(x).border}" title="${esc(x)}"></i>`).join('')}${tp.length>5?`<small>+${tp.length-5}</small>`:''}</div>${brandPills(l)}${bar(l)}`;
    }
    h+=`<div class="${cls.join(' ')}"${l.length?` style="--r:${(l.length/mxc).toFixed(2)}" data-d="${k}" tabindex="0" role="button" aria-label="${d} ${MONTHS[m]}, ${l.length} unit"`:''}>${inner}</div>`;
  }
  $('calendarDays').innerHTML=h;
}
const listRow=i=>`<button class="lr" data-i="${i.id}"><span class="tag" style="background:${sty(i.type).border}"></span><span class="mn"><b>${esc(i.serial)}</b><em>${i.unit?'Unit '+esc(i.unit):'Tanpa nomor unit'}</em></span><span class="cli">${esc(i.client)}${brandBadge(i)}</span><span class="ty" style="color:${sty(i.type).text}">${esc(i.type)}</span>${pill(i.status)}</button>`;
function renderList(items){
  const box=$('listView');
  if(!items.length){box.innerHTML='<div class="empty"><b>Tidak ada jadwal pengiriman</b>Coba ganti bulan, status, atau kata pencarian.</div>';return}

function renderClients(items){
  const map={};items.forEach(i=>{const o=map[i.client]=map[i.client]||{t:0,ty:{},b:i.brand};o.t++;o.ty[i.type]=(o.ty[i.type]||0)+1});

}

const dayRow=i=>`<button class="dr" data-i="${i.id}"><span class="tag" style="background:${sty(i.type).border}"></span><span><b>${esc(i.serial)}</b><em>${esc(i.type)}${i.unit?', unit '+esc(i.unit):''}${brandBadge(i)}</em></span>${pill(i.status)}</button>`;

function stepDay(dir){

function openItem(it){
  const r=it.raw,code=it.sn&&it.unit?`${it.sn}/${it.unit}`:(it.sn||'N/A');
  $('itTitle').textContent=it.serial;$('itSub').textContent=`${it.client}, ${it.d.toLocaleDateString('id-ID',LONG)}`;$('itPill').innerHTML=brandBadge(it)+pill(it.status);
  let kv='';
  for(const k in r){
    if(!r[k])continue;const kl=k.toLowerCase().trim();if(HIDDEN.includes(kl))continue;let v=r[k];
    if(kl.includes('status delivery')||kl.includes('date')||kl.includes('tanggal')){const p=new Date(v);if(!isNaN(p)&&typeof v!=='number')v=p.toLocaleDateString('id-ID',LONG)}
    kv+=`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
  }
  $('modalBody').innerHTML=(isSys(it)?`<div class="note" style="margin-top:10px">${INFO}<div><b>Unit stok untuk kepentingan sistem.</b> ${SYS_TXT}</div></div>`:'')+(code!=='N/A'?`<div class="bc"><b>${esc(code)}</b><svg id="bcSvg"></svg></div>`:'')+`<div class="kv">${kv}</div>`;

function calReport(items){
  const ms=[...new Set(items.map(i=>mIdx(i.d)))].sort((a,b)=>a-b),multi=ms.length>1,per={};
  items.forEach(i=>per[i.key]=(per[i.key]||0)+1);const mx=Math.max(1,...Object.values(per));
  const dot=(c,s)=>c[s]?`<span><i class="${s}"></i>${c[s]}</span>`:'';
  return`<div class="rc-wrap${multi?' multi':''}" style="--h:${multi?'9.5mm':'14mm'}">`+ms.map(x=>{
    const y=Math.floor(x/12),m=x%12,n=new Date(y,m+1,0).getDate(),f=new Date(y,m,1).getDay(),l=items.filter(i=>mIdx(i.d)===x),by={};
    l.forEach(i=>(by[i.d.getDate()]=by[i.d.getDate()]||[]).push(i));
    let g=DAYS.map((d,i)=>`<div class="w${i?'':' sun'}">${multi?d.slice(0,3):d}</div>`).join('')+'<div class="e"></div>'.repeat(f);
    for(let d=1;d<=n;d++){
      const a=by[d]||[],k=ymd(y,m,d),c=count(a),hol=HOL[k],off=new Date(y,m,d).getDay()===0||hol,sy=a.length&&k===SYS;
      const bg=a.length&&!sy?` style="background:rgba(30,156,154,${(.08+.22*a.length/mx).toFixed(2)})"`:'';
      g+=`<div class="${sy?'sy':off&&!a.length?'o':''}"${bg}><div class="rc-t"><b>${d}</b>${a.length?`<span class="rc-n">${a.length}</span>`:''}</div>`+
        (a.length?`<div class="rc-s">${['sent','pending','stock'].map(s=>dot(c,s)).join('')}</div><div class="rb">${['sent','pending','stock'].map(s=>c[s]?`<i class="${s}" style="flex:${c[s]}"></i>`:'').join('')}</div>`:hol?`<em>${esc(hol)}</em>`:'')+'</div>';
    }
    g+='<div class="e"></div>'.repeat((7-(f+n)%7)%7);
    const t=count(l);
    return`<div class="rc"><h3><span>${MONTHS[m]} ${y}</span><span class="rc-l">${['sent','pending','stock'].map(s=>`<span><i class="${s}"></i>${t[s]} ${ST[s]}</span>`).join('')}</span></h3><div class="rc-g">${g}</div></div>`;
  }).join('')+'</div>';
}
function reportHtml(items,period,note){

  const c=count(items),t=items.length,pct=Math.round(c.sent/t*100),sysN=SYS?items.filter(i=>i.key===SYS).length:0;

  });
  const now=new Date().toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'});
  return`<div class="rp">
  <div class="rp-head">
   <div class="rp-brand"><img src="MSB Logo.png" alt="" onerror="this.style.display='none'"><div><b>PT Murinda Sentra Baja</b><span>Jl. Raya Kalijati Purwadadi No. 123A, Kalijati, Subang, Jawa Barat 41271. Telp (+62260) 7495467, plant@murinda.com</span></div></div>
   <div class="rp-right"><div class="rp-doc"><h1>Laporan Jadwal Pengiriman</h1><p>Periode: ${esc(period)}</p><p>Dicetak: ${now}</p></div><div class="rp-qr">${$('qrBox').querySelector('.qrimg').innerHTML}<span><b>Schedule Update</b>Scan untuk jadwal terbaru</span></div></div>
  </div>
  <div class="rp-k"><div><b>${t}</b><span>Total unit</span></div><div class="s"><b>${c.sent}</b><span>Terkirim</span></div><div class="p"><b>${c.pending}</b><span>Pending</span></div><div class="k"><b>${c.stock}</b><span>Stock</span></div></div>
  <div class="rp-bar"><i style="width:${c.sent/t*100}%;background:#0E9F6E"></i><i style="width:${c.pending/t*100}%;background:#D97706"></i><i style="width:${c.stock/t*100}%;background:#94A3B8"></i></div>
  <p class="rp-cap">Tingkat terkirim ${pct}% (${c.sent} dari ${t} unit).${note?' Filter aktif: '+esc(note)+'.':''}</p>${sysN?`<p class="rp-cap">Catatan: ${sysN} unit pada ${sysLabel()} adalah unit stok untuk kepentingan sistem. ${SYS_TXT}</p>`:''}
  <h2>Kalender jadwal</h2>${calReport(items)}
  <h2 class="brk">Ringkasan per client</h2>
  <table class="sm"><thead><tr><th>Client</th><th class="n">Total</th><th class="n">Terkirim</th><th class="n">Pending</th><th class="n">Stock</th></tr></thead><tbody>${crow}</tbody></table>
  <h2>Rincian pengiriman</h2>
  <table><thead><tr><th class="n">No</th><th>Serial number</th><th>Unit</th><th>Client</th><th>Brand</th><th>Tipe</th>${hasDn?'<th>No. pengiriman</th>':''}${hasVeh?'<th>Kendaraan / driver</th>':''}<th>Status</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="rp-sign">Dokumen ini dihasilkan otomatis oleh sistem Master Schedule PT Murinda Sentra Baja berdasarkan data pada saat dicetak.</p>
 </div>`;
}
function exportPDF(items,period,note,name){
  if(!items.length){toast('Tidak ada data untuk diexport');return}

function bind(){
  const mo=$('monthSelect'),yr=$('yearSelect');
  MONTHS.forEach((n,i)=>mo.add(new Option(n,i)));
  fillYears();MONTHS.forEach((n,i)=>{$('fromM').add(new Option(n,i));$('toM').add(new Option(n,i))});
  $('brandTabs').onclick=e=>{const b=e.target.closest('[data-b]');if(b){fBrand=b.dataset.b;renderAll()}};
  $('rangeBtn').onclick=()=>{const x=mIdx(cur),mx=data.reduce((a,i)=>Math.max(a,mIdx(i.d)),x);rFrom=x;rTo=mx;rangeOn=true;renderAll()};
  $('rangeOff').onclick=()=>{rangeOn=false;renderAll()};
  const rc=()=>{rFrom=+$('fromY').value*12+ +$('fromM').value;rTo=+$('toY').value*12+ +$('toM').value;if(rTo<rFrom)[rFrom,rTo]=[rTo,rFrom];renderAll()};
  ['fromM','fromY','toM','toY'].forEach(id=>$(id).onchange=rc);
  const go=()=>{cur=new Date(+yr.value,+mo.value,1);renderAll()};
  mo.onchange=yr.onchange=go;
  const shift=n=>{cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);renderAll()};
  $('prevM').onclick=()=>shift(-1);$('nextM').onclick=()=>shift(1);
  $('todayBtn').onclick=()=>{const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);renderAll()};
  $('jumpDate').onchange=e=>{
    const v=e.target.value;if(!v)return;const [y,m]=v.split('-').map(Number);
    cur=new Date(y,m-1,1);rangeOn=false;fStatus='all';q='';$('q').value='';renderAll();
    data.some(i=>i.key===v&&brandOK(i))?openDay(v):toast('Tidak ada jadwal pengiriman pada tanggal tersebut');e.target.value='';
  };
  $('viewSeg').onclick=e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;renderAll()}};
  $('statusChips').onclick=e=>{const b=e.target.closest('[data-s]');if(b){fStatus=b.dataset.s;renderAll()}};
  $('q').oninput=e=>{q=e.target.value;renderAll()};
  $('calendarDays').onclick=e=>{const c=e.target.closest('[data-d]');if(c)openDay(c.dataset.d)};
  $('calendarDays').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('[data-d]');if(c){e.preventDefault();openDay(c.dataset.d)}}};
  $('listView').onclick=e=>{const r=e.target.closest('[data-i]');if(r)return openItem(data[+r.dataset.i]);const h=e.target.closest('[data-d]');if(h)openDay(h.dataset.d)};
  $('summaryContainer').onclick=e=>{const b=e.target.closest('.cl>button');if(!b)return;const c=b.parentElement;c.classList.toggle('open');c.classList.contains('open')?openC.add(c.dataset.c):openC.delete(c.dataset.c)};
  $('dayModalBody').onclick=e=>{const r=e.target.closest('[data-i]');if(r)openItem(data[+r.dataset.i])};
  $('dmTabs').onclick=e=>{const b=e.target.closest('[data-s]');if(b){dayF=b.dataset.s;renderDay()}};
  $('dmPrev').onclick=()=>stepDay(-1);$('dmNext').onclick=()=>stepDay(1);
  $('dmClose').onclick=closeDay;$('itClose').onclick=closeItem;
  $('dayModal').onclick=e=>{if(e.target.id==='dayModal')closeDay()};
  $('itemModal').onclick=e=>{if(e.target.id==='itemModal')closeItem()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('itemModal').classList.contains('show')?closeItem():$('dayModal').classList.contains('show')&&closeDay()}});
  $('exportBtn').onclick=()=>{
    const n=[];if(fBrand!=='all')n.push('brand '+brandName(fBrand));if(fStatus!=='all')n.push('status '+ST[fStatus]);if(q.trim())n.push(`pencarian "${q.trim()}"`);
    exportPDF(filtered(),periodLabel(),n.join(', '));
  };
  $('dmExport').onclick=()=>{
    const [y,m,d]=dayKey.split('-').map(Number),dt=new Date(y,m-1,d);
    exportPDF(dayList(),dt.toLocaleDateString('id-ID',LONG),[fBrand!=='all'?'brand '+brandName(fBrand):'',dayF==='all'?'':'status '+ST[dayF]].filter(Boolean).join(', '),`${d} ${MONTHS[m-1]} ${y}`);
  };
}

/* ===== Latar foto Indonesia (Wikimedia Commons, lisensi bebas) ===== */
const PHOTOS=[
 ['Mount Bromo at sunrise, showing its volcanoes and Mount Semeru (background).jpg','Gunung Bromo, Jawa Timur'],
 ['Borobudur Sunrise 2012-01-05.jpg','Candi Borobudur, Jawa Tengah'],
 ['Brantan Bali Pura-Ulun-Danu-Bratan-01.jpg','Pura Ulun Danu Bratan, Bali']
];
const PH={on:''};
function initBg(){
  const bg=document.querySelector('.bg'),cap=$('phCap'),els=[];let k=0;
  const show=n=>{els.forEach((e,i)=>e.classList.toggle('on',i===n));const e=els[n],f=PHOTOS[+e.dataset.i];PH.on=e.dataset.u;
    cap.href='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(f[0]);cap.textContent=`Foto: ${f[1]}, Wikimedia Commons`};
  PHOTOS.forEach(([f],i)=>{
    const u='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=1600',im=new Image();
    im.onload=()=>{const e=document.createElement('i');e.className='ph';e.style.backgroundImage=`url("${u}")`;e.dataset.u=u;e.dataset.i=i;bg.appendChild(e);els.push(e);if(els.length===1)show(0)};
    im.src=u;
  });
  cap.hidden=true;setTimeout(()=>{cap.hidden=!els.length},1500);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{if(els.length>1){k=(k+1)%els.length;show(k)}},10000);
}

/* ===== Jalankan ===== */
BRAND_RULES.forEach(r=>document.documentElement.style.setProperty('--logo-'+r.id,`url("${r.logo}")`));
bind();initBg();
const tick=()=>{$('realTimeClock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' WIB'};
tick();setInterval(tick,1000);
setInterval(()=>{timer--;$('countdown').textContent=timer;if(timer<=0){timer=60;fetchData(true)}},1000);
renderAll();fetchData();
</script>
